services:
  backend:
    build:
      context: .
      dockerfile: webservice/backend.dockerfile

    container_name: gophergpt-webservice

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      # passed through from the host shell so `FORCE_REINDEX=1 docker compose up`
      # actually reaches the app — without this the variable stops at the compose
      # CLI and the reindex silently does not happen
      - FORCE_REINDEX=${FORCE_REINDEX:-}
      - CATALOG_SOURCE=${CATALOG_SOURCE:-}
      - CATALOG_MAX_AGE_HOURS=${CATALOG_MAX_AGE_HOURS:-}

    restart: always

    volumes:
      - ./webservice/data:/app/data
      - ./evals:/usr/src/app/evals     # eval results survive rebuilds + stay visible to git
      - ./scripts:/usr/src/app/scripts # judge/runner edits apply without a rebuild
      - ./autonomy/rag/data:/usr/src/app/autonomy/rag/data # courses.csv is gitignored — mount it so
                                                           # dropping in a new export needs no rebuild

    depends_on:        # wait for postgres container
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.dockerfile

      args:
        REACT_APP_API_BASE: /api

    container_name: gophergpt-frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

    restart: always


  nginx:
    image: nginx:alpine

    container_name: gophergpt-nginx

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro

    depends_on:
      - frontend
      - backend

    restart: always


  postgres:
    image: pgvector/pgvector:pg16
    container_name: gophergpt-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gophergpt
      POSTGRES_PASSWORD: gophergpt
      POSTGRES_DB: gophergpt
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: gophergpt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always


volumes:
  postgres_data:
  redis_data:
